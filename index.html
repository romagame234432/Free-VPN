<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free-VPN</title>
  <style>
    body {
      margin: 0;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
    }
    h1 { color: #38bdf8; }
    .card {
      max-width: 350px;
      margin: 40px auto;
      padding: 30px;
      background: #1e293b;
      border-radius: 20px;
    }
    button {
      background: #0ea5e9;
      color: white;
      border: 0;
      padding: 16px 35px;
      border-radius: 30px;
      font-size: 18px;
    }
    p { color: #cbd5e1; }
  </style>
</head>
<body>
  <h1>Free-VPN</h1>
  <div class="card">
    <h2>Защищённое подключение</h2>
    <p>Твой VPN-проект для iPhone</p>
    <button onclick="alert('VPN-сервер ещё не настроен')">
      Подключить
    </button>
    <p>Статус: сервер не настроен</p>
  </div>
</body>
</html>
